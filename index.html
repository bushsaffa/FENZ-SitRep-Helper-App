<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#221160">
<title>SitRep Helper</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<main>
  <h1>SITREP HELPER</h1>
  <div class="sub">Draft aid for radio calls. Not an official FENZ tool.</div>

  <section id="reportsBox" hidden>
    <div class="title">Reports</div>
    <div class="chips" id="reportChips"></div>
    <div class="btns">
      <button class="btn grey" id="dlAllBtn">DOWNLOAD ALL</button>
      <button class="btn grey" id="clearAllBtn">CLEAR ALL</button>
    </div>
  </section>

  <section>
    <div class="title">Incident</div>
    <div class="chips" id="typeChips"></div>
  </section>

  <section>
    <div class="title">Callsign</div>
    <input id="callsign" placeholder="e.g. 8671" autocomplete="off">
  </section>

  <section>
    <div class="title">Report</div>
    <textarea id="transcript" rows="6"></textarea>
    <button class="btn grey" id="micBtn">START VOICE</button>
    <div class="note" id="micStatus"></div>
  </section>

  <section class="alert" id="vitalBox" hidden>
    <details id="vitalDetails">
      <summary id="vitalSummary"></summary>
      <div id="vitalList"></div>
    </details>
  </section>

  <section id="scriptBox" hidden>
    <div class="title">Radio script</div>
    <div id="script"></div>
    <div class="btns">
      <button class="btn" id="copyBtn">COPY</button>
      <button class="btn" id="dlBtn">DOWNLOAD CURRENT</button>
    </div>
    <button class="btn" id="nextBtn">RECORD NEXT</button>
    <button class="btn grey" id="clearBtn">CLEAR CURRENT</button>
  </section>

  <section id="optBox" hidden>
    <details id="optDetails">
      <summary id="optSummary"></summary>
      <div id="optList"></div>
    </details>
  </section>

  <section id="heardBox" hidden>
    <details id="heardDetails">
      <summary id="heardSummary"></summary>
      <div id="fields"></div>
    </details>
  </section>

  <section>
    <div class="title">Next report due in</div>
    <div id="timerBox">--:--</div>
    <div class="btns">
      <button class="btn grey" id="timerBtn">START/RESET</button>
      <button class="btn grey" id="timerStopBtn">STOP</button>
    </div>
  </section>

  <p class="note" style="text-align:center;margin:16px 0 24px">&copy; 2026 Andy Armour. All rights reserved.</p>

</main>

<!-- Classic scripts (not ES modules) so the app still works when opened straight from a file.
     Order matters: each file uses the ones above it. -->
<script src="js/helpers.js"></script>
<script src="js/config.js"></script>
<script src="js/vocab.js"></script>
<script src="js/patients.js"></script>
<script src="js/extract.js"></script>
<script src="js/script-builder.js"></script>
<script src="js/ui.js"></script>
<script src="js/reports.js"></script>
<script src="js/voice.js"></script>
<script src="js/timer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
